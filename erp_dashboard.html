<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>ERP Dashboard</title>
    <style>
      #erp-market-strip {
        position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
        background: #1f2937; color: #f3f4f6;
        padding: 8px 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        border-bottom: 1px solid #374151;
        display: flex; align-items: center; gap: 12px;
      }
      #erp-market-strip select { font-size: 14px; padding: 2px 6px; }
      #erp-source-badge { color: #cbd5e1; font-size: 13px; }
      #erp-refresh-btn {
        font-size: 13px; padding: 4px 10px; border-radius: 4px;
        background: #374151; color: #f3f4f6;
        border: 1px solid #4b5563; cursor: pointer;
      }
      #erp-refresh-btn:hover:not(:disabled) { background: #4b5563; }
      #erp-refresh-btn:disabled { opacity: 0.6; cursor: progress; }
      #erp-refresh-toast {
        margin-left: 4px; color: #cbd5e1; font-size: 13px;
      }
      #erp-auto-refresh-wrap {
        display: flex; align-items: center; gap: 6px;
        margin-left: auto;
      }
      #erp-auto-refresh-wrap label { color: #cbd5e1; font-size: 13px; }
      #erp-cloud-modal {
        position: fixed; inset: 0; z-index: 100000;
        background: rgba(0,0,0,0.55);
        display: none; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #erp-cloud-modal.open { display: flex; }
      #erp-cloud-modal-card {
        background: #ffffff; color: #111827;
        max-width: 720px; width: 90%;
        max-height: 80vh; overflow: auto;
        border-radius: 8px; padding: 20px 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      }
      #erp-cloud-modal-card h2 { margin: 0 0 8px; font-size: 18px; }
      #erp-cloud-modal-card pre {
        background: #f3f4f6; color: #111827;
        padding: 12px; border-radius: 4px;
        font-size: 12px; overflow-x: auto;
      }
      #erp-cloud-modal-card .erp-modal-actions {
        margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end;
      }
      #erp-cloud-modal-card button {
        font-size: 13px; padding: 6px 14px; border-radius: 4px;
        border: 1px solid #d1d5db; background: #ffffff; cursor: pointer;
      }
      #erp-cloud-modal-card button.primary {
        background: #2563eb; color: #ffffff; border-color: #2563eb;
      }
      body { padding-top: 44px; }
    </style>
    <!--
      Per-market display labels injected by server.py from
      markets_config.MARKETS at request time. Single source of truth.
      Adding a market in Phase 3/4 = filling display_index_name /
      display_rfr_name / currency_symbol on its MarketSpec; nothing here
      to edit. If the marker is not substituted (e.g. when serving the
      file directly without Flask), the relabel below falls back to a
      no-op and the page renders with the bundle's hardcoded US labels.
    -->
    <!-- __ERP_LABELS__ -->
    <!--
      Phase 2 market-switcher injection.
      Installs fetch + XHR monkey-patches BEFORE the React bundle module loads,
      so every /api/* request the bundle issues carries the chosen market.
      Module scripts are deferred, so this classic script runs first.
      Phase 2.1 adds DOM relabel + currency-symbol swap driven by
      window.__ERP_LABELS__.
    -->
    <script>
      (function () {
        var KEY = 'erp_market';
        function getMarket() { return localStorage.getItem(KEY) || 'US'; }
        function setMarket(m) {
          localStorage.setItem(KEY, m);
          window.__ERP_MARKET__ = m;
        }
        setMarket(getMarket());

        function withMarket(url) {
          if (!url || typeof url !== 'string') return url;
          if (url.indexOf('/api/') === -1) return url;
          if (/[?&]market=/.test(url)) return url;
          var sep = url.indexOf('?') === -1 ? '?' : '&';
          return url + sep + 'market=' + encodeURIComponent(getMarket());
        }

        function mergeMarket(body) {
          if (typeof body !== 'string' || body.length === 0) return body;
          try {
            var obj = JSON.parse(body);
            if (obj && typeof obj === 'object' && !Array.isArray(obj) && obj.market === undefined) {
              obj.market = getMarket();
              return JSON.stringify(obj);
            }
          } catch (_) { /* not JSON */ }
          return body;
        }

        var _fetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          try {
            var urlStr = (typeof input === 'string')
              ? input
              : (input && input.url) || '';
            if (urlStr.indexOf('/api/') !== -1) {
              var method = ((init && init.method)
                || (typeof input !== 'string' && input && input.method)
                || 'GET').toUpperCase();
              if (method === 'GET' || method === 'HEAD') {
                var newUrl = withMarket(urlStr);
                if (newUrl !== urlStr) {
                  if (typeof input === 'string') {
                    return _fetch(newUrl, init);
                  }
                  return _fetch(new Request(newUrl, input), init);
                }
              } else if (init && typeof init.body === 'string') {
                var newBody = mergeMarket(init.body);
                if (newBody !== init.body) {
                  init = Object.assign({}, init, { body: newBody });
                }
              }
            }
          } catch (e) { /* fall through */ }
          return _fetch(input, init);
        };

        var _open = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          try {
            if (typeof url === 'string' && url.indexOf('/api/') !== -1
                && (method || 'GET').toUpperCase() === 'GET') {
              arguments[1] = withMarket(url);
            }
          } catch (e) { /* ignore */ }
          return _open.apply(this, arguments);
        };
        var _send = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function (body) {
          try {
            if (typeof body === 'string') {
              var newBody = mergeMarket(body);
              if (newBody !== body) arguments[0] = newBody;
            }
          } catch (e) { /* ignore */ }
          return _send.apply(this, arguments);
        };

        // ── Per-market label rewrite (Phase 2.1) ───────────────────
        // The compiled React bundle has US-specific strings hardcoded.
        // We text-substitute them at the DOM level, anchored on whatever
        // labels markets_config declared for US so this works for any
        // future market without further code changes here.
        var _RELABEL = { busy: false, reps: [], currency: null };

        function getLabels() {
          var tbl = window.__ERP_LABELS__ || {};
          return tbl[getMarket()] || null;
        }

        function buildReps(labels) {
          // Anchor on the US labels (what the bundle has hardcoded).
          // Replacement order is longest-string-first so a longer pattern
          // matches before a shorter one that's a substring of it.
          var us = (window.__ERP_LABELS__ || {}).US;
          if (!us || !labels) return [];
          var reps = [];
          var idxLong  = labels.indexName, idxShort = labels.indexShort;
          var usIdxLong = us.indexName,    usIdxShort = us.indexShort;
          if (idxLong && idxLong !== usIdxLong) {
            reps.push([usIdxLong + ' Implied Equity Risk Premium',
                       idxLong + ' Implied Equity Risk Premium']);
            reps.push([usIdxLong + ' Level',  idxLong + ' Level']);
            reps.push([usIdxLong + ' Used',   idxLong + ' Used']);
            reps.push([usIdxLong,             idxLong]);
          }
          if (usIdxShort && idxShort && idxShort !== usIdxShort) {
            // 'S&P aggregate' (sub-label) uses the brand short
            reps.push([usIdxShort + ' aggregate', idxShort + ' aggregate']);
            // bare brand short — table headers, scenario presets like
            // '+7% S&P, +8% EPS, rates flat' → '+7% FTSE, ...'
            reps.push([usIdxShort, idxShort]);
          }
          var rfrLong  = labels.rfrLabel, rfrShort = labels.rfrShort;
          var usRfrLong = us.rfrLabel,    usRfrShort = us.rfrShort;
          if (rfrLong && usRfrLong && rfrLong !== usRfrLong) {
            // Long forms — chart name 'T-Bond Rate (%)', input 'T-Bond Rate %'
            reps.push([usRfrLong + ' (%)', rfrLong + ' (%)']);
            reps.push([usRfrLong + ' %',   rfrLong + ' %']);
            reps.push([usRfrLong,          rfrLong]);
          }
          if (usRfrShort && rfrShort && rfrShort !== usRfrShort) {
            // Bare short — column header 'T-Bond', formula 'ERP + T-Bond'
            reps.push([usRfrShort, rfrShort]);
            // The bundle also has a title-case-with-lowercase-tail variant
            // in 'ERP + T-bond'. Capital first letter, rest lowercased.
            var usTitleTail = usRfrShort.length
              ? usRfrShort[0] + usRfrShort.slice(1).toLowerCase()
              : '';
            if (usTitleTail && usTitleTail !== usRfrShort) {
              // Replacement keeps the per-market short's natural casing
              // ('Gilt', 'Bund', 'JGB') — reading 'ERP + Gilt' / 'ERP + JGB'.
              reps.push([usTitleTail, rfrShort]);
            }
            // All-lowercase fallback in case any future market label uses it.
            var usAllLc = usRfrShort.toLowerCase();
            if (usAllLc !== usRfrShort && usAllLc !== usTitleTail) {
              reps.push([usAllLc, rfrShort.toLowerCase()]);
            }
          }
          return reps;
        }

        function _shouldSkipNode(n) {
          if (!n.parentNode) return true;
          var p = n.parentNode;
          while (p && p !== document.body && p !== document.documentElement) {
            if (p.id === 'erp-market-strip') return true;
            var t = p.nodeName;
            if (t === 'SCRIPT' || t === 'STYLE') return true;
            p = p.parentNode;
          }
          return false;
        }

        function relabelTree(root) {
          if (!root) return;
          if (!_RELABEL.reps.length
              && (!_RELABEL.currency || _RELABEL.currency === '$')) return;
          if (_RELABEL.busy) return;
          _RELABEL.busy = true;
          try {
            // root may itself be a text node or an element
            var nodes = [];
            if (root.nodeType === 3) {
              nodes.push(root);
            } else if (root.nodeType === 1) {
              var it = document.createNodeIterator(root, NodeFilter.SHOW_TEXT);
              var n;
              while ((n = it.nextNode())) nodes.push(n);
            }
            var curRe = (_RELABEL.currency && _RELABEL.currency !== '$')
              ? /(^|[^A-Za-z0-9])\$(?=\d|\s|$)/g
              : null;
            for (var i = 0; i < nodes.length; i++) {
              var node = nodes[i];
              if (_shouldSkipNode(node)) continue;
              var t = node.nodeValue;
              if (!t) continue;
              var changed = false;
              for (var j = 0; j < _RELABEL.reps.length; j++) {
                var pair = _RELABEL.reps[j];
                if (t.indexOf(pair[0]) !== -1) {
                  t = t.split(pair[0]).join(pair[1]);
                  changed = true;
                }
              }
              if (curRe && curRe.test(t)) {
                curRe.lastIndex = 0;
                t = t.replace(curRe, '$1' + _RELABEL.currency);
                changed = true;
              }
              if (changed) node.nodeValue = t;
            }
          } finally {
            _RELABEL.busy = false;
          }
        }

        function initRelabel() {
          var labels = getLabels();
          _RELABEL.reps     = buildReps(labels);
          _RELABEL.currency = labels ? labels.currencySymbol : null;
          // Identity case: nothing to do.
          if (!_RELABEL.reps.length
              && (!_RELABEL.currency || _RELABEL.currency === '$')) {
            return;
          }
          relabelTree(document.body);
          // Re-apply on every React re-render (chart redraws, scenario edits, …).
          var mo = new MutationObserver(function (muts) {
            if (_RELABEL.busy) return;
            for (var i = 0; i < muts.length; i++) {
              var m = muts[i];
              if (m.type === 'characterData') {
                relabelTree(m.target);
              } else if (m.addedNodes && m.addedNodes.length) {
                for (var k = 0; k < m.addedNodes.length; k++) {
                  relabelTree(m.addedNodes[k]);
                }
              }
            }
          });
          mo.observe(document.body, {
            childList: true, subtree: true, characterData: true
          });
        }

        function buildStrip() {
          if (document.getElementById('erp-market-strip')) return;
          var strip = document.createElement('div');
          strip.id = 'erp-market-strip';
          strip.innerHTML =
            '<label for="erp-market-select"><strong>Market:</strong></label>'
            + '<select id="erp-market-select">'
              + '<option value="US">US</option>'
              + '<option value="UK">UK</option>'
              + '<option value="EU">EU</option>'
              + '<option value="JP">JP</option>'
              + '<option value="KR">KR</option>'
              + '<option value="IN">IN</option>'
              + '<option value="TW">TW</option>'
              + '<option value="CN">CN (MSCI)</option>'
              + '<option value="CN_CSI">CN (CSI 300)</option>'
            + '</select>'
            + '<button id="erp-refresh-btn" type="button"'
              + ' title="Run --update across every market. Your laptop must be open while this runs.">'
              + '↻ Refresh now'
            + '</button>'
            + '<span id="erp-refresh-toast"></span>'
            + '<span id="erp-source-badge"></span>'
            + '<span id="erp-auto-refresh-wrap">'
              + '<label for="erp-auto-refresh-select">Auto-refresh:</label>'
              + '<select id="erp-auto-refresh-select">'
                + '<option value="manual" title="Click Refresh now from this dashboard. Laptop must be open.">⚙ Manual</option>'
                + '<option value="local" title="macOS launchd runs the refresh daily at 18:00 local. Laptop must be on at that time.">⏰ Local-daily</option>'
                + '<option value="cloud" title="GitHub Actions runs the refresh nightly. Laptop can be off.">☁ Cloud-nightly</option>'
              + '</select>'
            + '</span>';
          document.body.insertBefore(strip, document.body.firstChild);
          var sel = document.getElementById('erp-market-select');
          sel.value = getMarket();
          sel.addEventListener('change', function () {
            setMarket(sel.value);
            location.reload();
          });
          refreshSourceBadge();
          buildCloudModal();
          wireRefreshButton();
          wireAutoRefreshDropdown();
          initRelabel();
        }

        function setToast(text, color) {
          var el = document.getElementById('erp-refresh-toast');
          if (!el) return;
          el.textContent = text || '';
          el.style.color = color || '#cbd5e1';
        }

        function wireRefreshButton() {
          var btn = document.getElementById('erp-refresh-btn');
          if (!btn) return;
          btn.addEventListener('click', function () {
            btn.disabled = true;
            setToast('Refreshing all markets …', '#fde68a');
            window.fetch('/api/update-all', { method: 'POST' })
              .then(function (r) { return r.json(); })
              .then(function (j) {
                if (!j || !j.ok) {
                  setToast('Failed: ' + (j && j.error || 'unknown'), '#fca5a5');
                  return;
                }
                var s = j.summary || {};
                var parts = [];
                if (s.ok)      parts.push(s.ok + ' ok');
                if (s.skipped) parts.push(s.skipped + ' skipped');
                if (s.failed)  parts.push(s.failed + ' failed');
                setToast('Done: ' + parts.join(', ') + ' — reloading …',
                         s.failed ? '#fca5a5' : '#86efac');
                setTimeout(function () { location.reload(); }, 1200);
              })
              .catch(function (e) {
                setToast('Failed: ' + e, '#fca5a5');
              })
              .finally(function () { btn.disabled = false; });
          });
        }

        function wireAutoRefreshDropdown() {
          var sel = document.getElementById('erp-auto-refresh-select');
          if (!sel) return;
          // Initial mode from server
          window.fetch('/api/auto-refresh')
            .then(function (r) { return r.json(); })
            .then(function (j) {
              if (j && j.ok && j.mode) sel.value = j.mode;
            })
            .catch(function () { /* keep default Manual */ });

          sel.addEventListener('change', function () {
            var mode = sel.value;
            setToast('Setting auto-refresh: ' + mode + ' …', '#fde68a');
            window.fetch('/api/auto-refresh', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ mode: mode }),
            })
              .then(function (r) { return r.json(); })
              .then(function (j) {
                if (!j || !j.ok) {
                  setToast('Failed: ' + (j && j.error || 'unknown'), '#fca5a5');
                  return;
                }
                if (mode === 'cloud') {
                  showCloudModal(j);
                  setToast('', '#cbd5e1');
                } else if (mode === 'local') {
                  var loaded = j.launchd && j.launchd.loaded;
                  setToast(loaded ? 'Local-daily armed.' : 'launchd bootstrap returned, check server log.',
                           loaded ? '#86efac' : '#fde68a');
                } else {
                  setToast('Manual mode (auto-refresh off).', '#86efac');
                }
              })
              .catch(function (e) {
                setToast('Failed: ' + e, '#fca5a5');
              });
          });
        }

        function buildCloudModal() {
          if (document.getElementById('erp-cloud-modal')) return;
          var modal = document.createElement('div');
          modal.id = 'erp-cloud-modal';
          modal.innerHTML =
            '<div id="erp-cloud-modal-card">'
              + '<h2>Enable Cloud-nightly refresh</h2>'
              + '<p id="erp-cloud-modal-msg" style="margin:0 0 12px;color:#374151;font-size:13px;"></p>'
              + '<pre id="erp-cloud-modal-yaml"></pre>'
              + '<div class="erp-modal-actions">'
                + '<button type="button" id="erp-cloud-modal-copy">Copy YAML</button>'
                + '<button type="button" class="primary" id="erp-cloud-modal-close">Close</button>'
              + '</div>'
            + '</div>';
          document.body.appendChild(modal);
          document.getElementById('erp-cloud-modal-close')
            .addEventListener('click', closeCloudModal);
          modal.addEventListener('click', function (e) {
            if (e.target === modal) closeCloudModal();
          });
          document.getElementById('erp-cloud-modal-copy')
            .addEventListener('click', function () {
              var yaml = document.getElementById('erp-cloud-modal-yaml').textContent;
              if (navigator.clipboard && yaml) {
                navigator.clipboard.writeText(yaml).then(function () {
                  setToast('Copied YAML to clipboard.', '#86efac');
                });
              }
            });
        }

        function showCloudModal(j) {
          var modal = document.getElementById('erp-cloud-modal');
          var msg   = document.getElementById('erp-cloud-modal-msg');
          var pre   = document.getElementById('erp-cloud-modal-yaml');
          if (!modal || !msg || !pre) return;
          if (j.snapshot_has_cron) {
            msg.textContent = j.note || 'Cron already configured in snapshot.yml.';
            pre.textContent = '';
            pre.style.display = 'none';
          } else {
            msg.innerHTML = 'Paste the YAML below into <code>'
              + (j.snapshot_path || '.github/workflows/snapshot.yml')
              + '</code>, replacing the existing <code>on:</code> block, '
              + 'then commit and push to <code>main</code>. Cron runs in '
              + 'GitHub Actions — your laptop can be off.';
            pre.textContent = j.yaml_diff || '';
            pre.style.display = '';
          }
          modal.classList.add('open');
        }

        function closeCloudModal() {
          var modal = document.getElementById('erp-cloud-modal');
          if (modal) modal.classList.remove('open');
        }

        function refreshSourceBadge() {
          window.fetch('/api/latest')
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
              var el = document.getElementById('erp-source-badge');
              if (!el) return;
              var d = j && j.data ? j.data : null;
              if (!d) { el.textContent = ''; return; }
              var src = d.data_source || 'auto';
              var cur = d.currency || '';
              var notes = d.quality_notes ? ' — ' + d.quality_notes : '';
              // Phase 4: append per-market data_quality tier from __ERP_LABELS__.
              var labels = window.__ERP_LABELS__ || {};
              var entry  = labels[getMarket()] || {};
              var tier   = entry.dataQuality;
              var tierStr = (tier && tier !== 'full') ? ' · ' + tier : '';
              el.textContent = 'Source: ' + src + (cur ? ' (' + cur + ')' : '') + tierStr + notes;
            })
            .catch(function () { /* silent */ });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', buildStrip);
        } else {
          buildStrip();
        }
      })();
    </script>
