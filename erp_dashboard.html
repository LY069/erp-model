    <!--
      Phase 2 market-switcher injection.
      Installs fetch + XHR monkey-patches BEFORE the React bundle module loads,
      so every /api/* request the bundle issues carries the chosen market.
      Module scripts are deferred, so this classic script runs first.
    -->
    <script>
      (function () {
        var KEY = 'erp_market';
        function getMarket() { return localStorage.getItem(KEY) || 'US'; }
        function setMarket(m) {
          localStorage.setItem(KEY, m);
          window.__ERP_MARKET__ = m;
        }
        setMarket(getMarket());

        function withMarket(url) {
          if (!url || typeof url !== 'string') return url;
          if (url.indexOf('/api/') === -1) return url;
          if (/[?&]market=/.test(url)) return url;
          var sep = url.indexOf('?') === -1 ? '?' : '&';
          return url + sep + 'market=' + encodeURIComponent(getMarket());
        }

        function mergeMarket(body) {
          if (typeof body !== 'string' || body.length === 0) return body;
          try {
            var obj = JSON.parse(body);
            if (obj && typeof obj === 'object' && !Array.isArray(obj) && obj.market === undefined) {
              obj.market = getMarket();
              return JSON.stringify(obj);
            }
          } catch (_) { /* not JSON */ }
          return body;
        }

        var _fetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          try {
            var urlStr = (typeof input === 'string')
              ? input
              : (input && input.url) || '';
            if (urlStr.indexOf('/api/') !== -1) {
              var method = ((init && init.method)
                || (typeof input !== 'string' && input && input.method)
                || 'GET').toUpperCase();
              if (method === 'GET' || method === 'HEAD') {
                var newUrl = withMarket(urlStr);
                if (newUrl !== urlStr) {
                  if (typeof input === 'string') {
                    return _fetch(newUrl, init);
                  }
                  return _fetch(new Request(newUrl, input), init);
                }
              } else if (init && typeof init.body === 'string') {
                var newBody = mergeMarket(init.body);
                if (newBody !== init.body) {
                  init = Object.assign({}, init, { body: newBody });
                }
              }
            }
          } catch (e) { /* fall through */ }
          return _fetch(input, init);
        };

        var _open = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          try {
            if (typeof url === 'string' && url.indexOf('/api/') !== -1
                && (method || 'GET').toUpperCase() === 'GET') {
              arguments[1] = withMarket(url);
            }
          } catch (e) { /* ignore */ }
          return _open.apply(this, arguments);
        };
        var _send = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function (body) {
          try {
            if (typeof body === 'string') {
              var newBody = mergeMarket(body);
              if (newBody !== body) arguments[0] = newBody;
            }
          } catch (e) { /* ignore */ }
          return _send.apply(this, arguments);
        };

        function buildStrip() {
          if (document.getElementById('erp-market-strip')) return;
          var strip = document.createElement('div');
          strip.id = 'erp-market-strip';
          strip.innerHTML =
            '<label for="erp-market-select"><strong>Market:</strong></label>'
            + '<select id="erp-market-select">'
              + '<option value="US">US</option>'
              + '<option value="UK">UK</option>'
              + '<option value="EU" disabled>EU (Phase 3+)</option>'
              + '<option value="JP" disabled>JP (Phase 3+)</option>'
              + '<option value="KR" disabled>KR (Phase 3+)</option>'
              + '<option value="IN" disabled>IN (Phase 3+)</option>'
              + '<option value="TW" disabled>TW (Phase 3+)</option>'
              + '<option value="CN" disabled>CN (Phase 3+)</option>'
            + '</select>'
            + '<span id="erp-source-badge"></span>';
          document.body.insertBefore(strip, document.body.firstChild);
          var sel = document.getElementById('erp-market-select');
          sel.value = getMarket();
          sel.addEventListener('change', function () {
            setMarket(sel.value);
            location.reload();
          });
          refreshSourceBadge();
        }

        function refreshSourceBadge() {
          window.fetch('/api/latest')
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
              var el = document.getElementById('erp-source-badge');
              if (!el) return;
              var d = j && j.data ? j.data : null;
              if (!d) { el.textContent = ''; return; }
              var src = d.data_source || 'auto';
              var cur = d.currency || '';
              var notes = d.quality_notes ? ' — ' + d.quality_notes : '';
              el.textContent = 'Source: ' + src + (cur ? ' (' + cur + ')' : '') + notes;
            })
            .catch(function () { /* silent */ });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', buildStrip);
        } else {
          buildStrip();
        }
      })();
    </script>
